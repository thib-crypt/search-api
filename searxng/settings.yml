# SearXNG configuration for the Unified Search API.
# Inherits SearXNG's shipped defaults and only overrides what we need.
use_default_settings: true

server:
  # Overridden at startup by the SEARXNG_SECRET environment variable, which both
  # compose files set. "ultrasecretkey" is SearXNG's own placeholder, the string
  # its tooling looks for — so the fallback is a known placeholder rather than a
  # value nothing recognises, and this file is now baked into the image built by
  # `searxng/Dockerfile`.
  secret_key: "ultrasecretkey"
  limiter: false # internal-only instance; the API is the sole client
  image_proxy: false

search:
  # Enable JSON so the API can consume structured results.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

ui:
  static_use_hash: true
